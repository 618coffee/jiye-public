[project]
name = "xhskb-backend"
version = "0.1.0"
description = "XHS Knowledge Base - local backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "orjson>=3.10",
]

[tool.setuptools]
packages = ["app"]
